name: AISafetyCompliance Scheduled Feed Radar

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Allows committing updated cache/proposals or creating issues
  issues: write   # Allows opening an issue when new statutory amendments are detected

jobs:
  radar-check:
    name: Poll Sovereign Statutory Feeds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Feed Radar Ingestion
        id: run_radar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Executes the discovery agent, updates pending_proposals.yaml, and notifies Discord
          python -m src.agents.feed_discovery

          # Check if pending_proposals.yaml was created or modified
          if [ -n "$(git status --porcelain memory/pending_proposals.yaml)" ]; then
            echo "new_amendments=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_amendments=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on Regulatory Amendments (Create GitHub Issue)
        if: steps.run_radar.outputs.new_amendments == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Regulatory Radar Alert: New Statutory Provisions Detected",
              body: `### Sovereign Statutory Radar Update
            The autonomous radar discovered new regulatory provisions or amendments in tracked feeds and dispatched a notification to Discord.

            **Next Actions:**
            1. Review \`memory/pending_proposals.yaml\`.
            2. Review \`configs/regulatory_registry.yml\`.
            3. Run Curator to distill rules and index vectors into Qdrant:
               \`\`\`bash
               python -m src.agents.curator
               \`\`\``,
              labels: ["compliance", "regulatory-radar"]
            });