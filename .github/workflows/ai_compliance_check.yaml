name: AI Statutory Compliance Gate

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'examples/**'
      - 'evals/**'

permissions:
  contents: read
  security-events: write      # Required to upload SARIF to GitHub Code Scanning
  pull-requests: write        # Required to comment on PRs

jobs:
  statutory-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU-only PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hybrid Compliance Auditor & Generate SARIF
        id: run_audit
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.agents.auditor examples/ --sarif-out report.sarif

      - name: Upload SARIF Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Upload even if blocking violations caused the previous step to fail
        with:
          sarif_file: report.sarif
          category: statutory-compliance

      - name: Post Audit Status to PR
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentBody = `### 🚨 AI-Safety Statutory Audit Blocked
            This pull request failed automated compliance checks under:
            - **UK DUAA 2025 s. 80** (Automated Decision-Making Safeguards & Art. 22C)
            - **EU AI Act Reg 2024/1689** (Transparency & High-Risk Requirements)

            **Required Next Steps:**
            1. Check the **Security** or **Files Changed** tab to see line-by-line SARIF annotations.
            2. If this is solely automated decision logic, implement human review escalation hooks.
            3. If an explicit waiver applies, rerun with an authorized exemption rationale.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });